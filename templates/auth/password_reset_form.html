{% extends "layouts/guest.html" %}
{% block heading %}Forgot password{% endblock %}
{% block lede %}Enter your e-mail and we will send a reset link.{% endblock %}
{% block content %}
    <form method="POST">{% csrf_token %}
        <label for="email" class="block font-medium text-sm text-gray-700 dark:text-slate-200">Email</label>
        <input id="email" name="email" type="email" required class="block mt-1 w-full rounded-xs border-gray-300 text-sm focus:border-brand-500 focus:ring-brand-500 dark:border-slate-600">
        {% if form.email.errors %}<p class="mt-1 text-sm text-rose-600">{{ form.email.errors.0 }}</p>{% endif %}
        <div class="mt-4 flex items-center justify-between"><a href="{% url 'login' %}" class="text-sm underline text-gray-600 dark:text-slate-300">Back to sign in</a><button class="btn-app btn-md btn-brand">Email reset link</button></div>
    </form>
{% endblock %}
