{% extends "layouts/app.html" %}
{% block header %}Add Employee{% endblock %}
{% block content %}
<div class="page-form">
    <form method="POST" action="{% url 'employees.store' %}" class="space-y-6 card p-6">
        {% csrf_token %}
        {% include "employees/_form.html" with employee=None %}
        <div class="form-footer border-t border-gray-100 dark:border-slate-700 pt-5">
            <p class="text-xs text-gray-500 dark:text-slate-400">This creates the employee record <span class="font-medium">and</span> their login account.</p>
            <div class="form-footer-actions"><a href="{% url 'employees.index' %}" class="btn-app btn-md btn-secondary">Cancel</a><button type="submit" class="btn-app btn-md btn-brand">Create account</button></div>
        </div>
    </form>
</div>
{% endblock %}
