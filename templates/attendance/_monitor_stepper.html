{# Date stepper. Lives in the filter form; every results swap re-sends it out of band so prev/next follow the new date. #}
<div id="monitor-stepper"{% if oob %} hx-swap-oob="true"{% endif %} class="inline-flex items-center overflow-hidden rounded-xs border border-gray-300 dark:border-slate-600">
    <a href="?date={{ prev_day|date:'Y-m-d' }}{% if search %}&search={{ search|urlencode }}{% endif %}" hx-get="{% url 'attendance.monitor' %}?date={{ prev_day|date:'Y-m-d' }}" hx-include="#monitor-search" aria-label="Previous day" class="px-2 py-2 text-gray-500 hover:bg-gray-100 dark:text-slate-400 dark:hover:bg-slate-700"><svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg></a>
    <input type="date" id="monitor-date" name="date" value="{{ date|date:'Y-m-d' }}" class="border-0 bg-transparent px-2 py-1.5 text-sm focus:ring-0 dark:[color-scheme:dark]">
    <a href="?date={{ next_day|date:'Y-m-d' }}{% if search %}&search={{ search|urlencode }}{% endif %}" hx-get="{% url 'attendance.monitor' %}?date={{ next_day|date:'Y-m-d' }}" hx-include="#monitor-search" aria-label="Next day" class="px-2 py-2 text-gray-500 hover:bg-gray-100 dark:text-slate-400 dark:hover:bg-slate-700"><svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg></a>
</div>
