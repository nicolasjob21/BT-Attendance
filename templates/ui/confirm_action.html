<div x-data="{ open: false }" class="inline-block {{ wrap }}">
    <button type="button" @click="open = true" class="{{ trigger_classes }}">{{ button }}</button>
    <template x-teleport="body">
        <div x-show="open" x-cloak class="fixed inset-0 z-50 flex items-end justify-center p-4 sm:items-center" @keydown.escape.window="open = false">
            <div class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm" @click="open = false" x-transition.opacity></div>
            <form method="POST" action="{{ action }}" x-show="open" x-transition class="relative w-full max-w-md rounded-xs border border-gray-200 bg-white p-5 shadow-2xl dark:border-hair dark:bg-surface">
                {% csrf_token %}
                <h3 class="text-base font-semibold text-gray-900 dark:text-slate-100">{{ title }}</h3>
                <p class="mt-1.5 text-sm text-gray-600 dark:text-slate-300">{{ message }}</p>
                {% if reason %}
                    <label class="mt-3 block text-xs font-medium text-gray-600 dark:text-slate-300">{{ reason_label }}</label>
                    <textarea name="reason" rows="2" maxlength="500" class="mt-1 w-full rounded-xs border-gray-300 text-sm focus:border-brand-500 focus:ring-brand-500 dark:border-slate-600"></textarea>
                {% endif %}
                <div class="mt-4 flex justify-end gap-2">
                    <button type="button" @click="open = false" class="btn-app btn-md btn-secondary">Cancel</button>
                    <button type="submit" class="btn-app btn-md {{ btn }}">{{ button }}</button>
                </div>
            </form>
        </div>
    </template>
</div>
