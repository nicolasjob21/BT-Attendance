<a href="{{ href }}" @click="sidebar = false" :title="collapsed ? '{{ label }}' : ''"
   class="relative flex items-center gap-3 rounded-none border-l-2 px-3 py-2 text-sm font-medium transition-colors {% if active %}border-brand-500 bg-brand-50 text-brand-700 dark:border-accent-400 dark:bg-brand-500/12 dark:text-white{% else %}border-transparent text-gray-600 hover:bg-gray-100 hover:text-gray-900 dark:text-slate-400 dark:hover:bg-brand-500/8 dark:hover:text-white{% endif %}">
    <svg class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">{{ icon_svg }}</svg>
    <span class="sb-label">{{ label }}</span>
    {% if badge %}<span class="ml-auto grid h-5 min-w-[1.25rem] place-items-center rounded-full bg-accent-500 px-1.5 text-[10px] font-bold leading-none text-white animate-pulse" :class="collapsed ? 'lg:absolute lg:right-1 lg:top-1 lg:ml-0' : ''">{{ badge }}</span>{% endif %}
</a>
