<div id="flash"{% if oob %} hx-swap-oob="true"{% endif %}>
    {% for m in messages %}
        <div class="mx-4 mt-4 rounded-xs border px-4 py-3 text-sm sm:mx-6 {% if 'error' in m.tags %}border-rose-200 bg-rose-50 text-rose-800 dark:border-rose-900/50 dark:bg-rose-900/30 dark:text-rose-200{% else %}border-brand-200 bg-brand-50 text-brand-800 dark:border-brand-800 dark:bg-brand-900/30 dark:text-brand-200{% endif %}">{{ m }}</div>
    {% endfor %}
</div>
